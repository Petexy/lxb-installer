<!--
  The same password again, on the row of You that asks for it a second time.

  The shell's key (setting-password.svg) with the hole through its bow cut as
  a tick instead of a circle: the same key, because it is the same password,
  and the tick the shell's chosen mark is cut with, because this row is where
  the person says that it is the one they meant. The bow is a little larger
  than the key's own to give the tick room, and the tick is an opening, so it
  gets its own ring of water as the chosen mark's does.

  lxb:shape — the material is computed from this outline. See the shell's
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <circle id="bow" cx="10.6" cy="10.6" r="7.4"/>
    <path id="shaft" d="M14.4 14.4L27.2 27.2A1.5 1.5 0 0 1 25.1 29.3L12.3 16.5Z"/>
    <g id="wards">
      <rect x="19.6" y="17.2" width="2.9" height="6.6" rx="1.45" transform="rotate(-45 21.05 20.5)"/>
      <rect x="23.4" y="21" width="2.9" height="6" rx="1.45" transform="rotate(-45 24.85 24)"/>
    </g>
    <path id="tick" d="M7 10.9L9.6 13.5L14.2 8.3" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="bead"><use href="#bow"/><use href="#shaft"/><use href="#wards"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#tick" stroke="#000000"/>
    </mask>
  </defs>
  <g mask="url(#pierced)"><use href="#bead" fill="#ffffff"/></g>
</svg>
