<!--
  Replace a part: one thing taken out and another put in its place, the two
  arrows going each way — the row that puts Linexin where a partition was and
  what was on it goes.

  Two arrows rather than a part drawn with something in it: at a row's size
  the outline is what is read, and two arrows passing each other is the
  outline of an exchange in every set there is.

  lxb:shape — the material is computed from this outline. See the shell's
  category-games.svg, which is where it is explained.
-->

